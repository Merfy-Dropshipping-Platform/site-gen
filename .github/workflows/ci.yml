        run: pnpm exec jest --runInBand src/themes/__tests__/hero-container-empty-state.spec.ts
      # Заголовок, рассыпанный по буквам, собирается обратно на чтении. Панель
      # до 22.09 спредила СТРОКУ заголовка ради размера и превращала её в
      # объект с числовыми ключами; панель починена, но испорченные ревизии
      # уже лежат у магазинов, где настройку успели тронуть.
      - if: false
        run: pnpm exec jest --runInBand src/themes/__tests__/scattered-heading-repair.spec.ts
      # Дефолт темы не глушит ввод мерчанта. Панель пишет «Текст» подписки в
      # `description`, а bloom нёс в theme.json `text.content` — порты читают
      # цепочкой text → description, и дефолт побеждал всегда. Тестер сообщил
      # про vanilla, замер показал bloom, поэтому проверка гоняет все пять.
      - if: false
        run: pnpm exec jest --runInBand src/themes/__tests__/theme-default-shadows-input.spec.ts
      # Строка корзины показывает ВСЕ опции варианта, каждую под своим именем, —
      # проверяется ИСПОЛНЕНИЕМ скрипта секции в jsdom, а не чтением исходника.
      # Прежний гард проверял только вызов общего помощника, и flux его прошёл,
      # схлопывая пары в «Цвет/Размер» с жёсткими подписями (пункт 26, 22.09).
      - if: false
        run: pnpm exec jest --runInBand src/themes/__tests__/cart-variant-pairs-visible.spec.ts
      # «В корзину» со страницы товара кладёт ВЫДЕЛЕННЫЙ на экране вариант, с
      # номером комбинации и названием. Исполняется скрипт секции + делегат
      # корзины; сервер рисует чипы из одного порядка комбинаций, браузеру
      # отдаётся другой — ровно как на живом сайте 22.09 (пункт 26, повтор).
      - if: false
        run: pnpm exec jest --runInBand src/themes/__tests__/pdp-adds-visible-variant.spec.ts
      # Подпись строки корзины — из комбинации (что уйдёт в заказ), цвет — кружком
      # (владелец 23.09: «цвет не надо словами писать»), название экранируется.
      - if: false
        run: pnpm exec jest --runInBand src/themes/__tests__/cart-variant-from-catalog.spec.ts
      # Цвет варианта в корзине — той же формы, что на странице товара («Вариации»:
      # круг / квадрат / словом). Сравнивается НАСТОЯЩИЙ рендер страницы товара
      # (theme-base и порт flux) с тем, что нарисует корзина при глобале из той
      # же ревизии (владелец 23.09: «если кружок — кружок, квадратик — квадратик»).
      - if: false
        run: pnpm exec jest --runInBand src/themes/__tests__/cart-swatch-follows-product-page.spec.ts
      # «Сворачиваемый раздел» → «Размер заголовка» меняет только заголовок
      # секции: ряды разделов байт-в-байт одинаковы при любом размере (satin
      # их растягивала, владелец 23.09).
      - if: false
        run: pnpm exec jest --runInBand src/themes/__tests__/collapsible-heading-size-scope.spec.ts
      # «Следующее фото при наведении» — путь тестера: включил переключатель,
      # больше ничего не трогал, водит мышью. bloom и vanilla листают ВСЕ фото
      # по положению курсора (как на Авито), rose/satin/flux показывают второе;
      # сохранённый в ревизии «режим» на это не влияет (владелец 23.09).
      - if: false
        run: pnpm exec jest --runInBand src/themes/__tests__/catalog-next-photo-by-theme.spec.ts
      # Страница коллекции в конструкторе: сетка «Группы товаров» берёт
      # коллекцию страницы (контекст), а не служебный слаг «preview» и не проп
      # ревизии — было «0 ТОВАРОВ» на открытии и все товары после правки.
      - if: false
        run: pnpm exec jest --runInBand src/__tests__/collection-name-placeholder.spec.ts
      # «Стоимость» в «Группе товаров» — поля ввода в обеих раскладках всех тем:
      # у vanilla боковая панель не несла data-nt="catalog-price", и при виде
      # «Сбоку» цена была простым текстом (владелец 23.09).
      - if: false
        run: pnpm exec jest --runInBand src/themes/__tests__/catalog-price-filter-inputs.spec.ts
      # «Следующее фото при наведении» в «Каталоге товаров»: rose/satin/flux
      # показывают второе фото (bloom/vanilla листают — см. by-theme выше).
      # vanilla её когда-то не читала вовсе (0 упоминаний против 8–14).
      # Карточки рисует скрипт гидрации, поэтому скрипт исполняется в jsdom на
      # подложенном ответе витринного API, а наведение — настоящим событием.
      - if: false
        run: pnpm exec jest --runInBand src/themes/__tests__/catalog-next-photo-hover.spec.ts
      # «Фильтры и сортировка» на телефоне — шторка по вёрстке пяти тем
      # (владелец 23.09: «адаптив мобилы взять с вёрстки»; 18.09 то же просили
      # «из rose», сделали одну тему). Одна кнопка, в шторке фильтры и
      # сортировка, открыть / «Закрыть» / «Показать» / Esc, замок прокрутки на
      # <html>, перерисовка в конструкторе снимает замок, брейкпоинт темы.
      - if: false
        run: pnpm exec jest --runInBand src/themes/__tests__/catalog-filters-sheet.spec.ts
      # «Цвет» и «Коллекции» в боковой панели фильтров (и в шторке, и
      # «Сбоку»): кольцо невыбранного пункта серое и без точки, выбранного —
      # цветом текста с точкой 10px, в CSS ВИТРИНЫ (dist/theme-css). Кнопки
      # рисует скрипт порта, его классы кольца живая сборка не видит — прод-
      # замер 23.09: невыбранные обведены цветом текста; у satin и vanilla у
      # выбранного пункта не было точки.
      - if: false
        run: pnpm exec jest --runInBand src/themes/__tests__/catalog-filter-color-rings.spec.ts
      # «Коллекции» и «Цвет» в шторке «Фильтры и сортировка», пять тем
      # (владелец 23.09: вернуть «Коллекции» в шторку, добавить цвет в
      # vanilla). Что видно в шторке и что уходит на сервер после выбора; цвет
      # выбирается один — сервер фильтрует по одному значению группы.
      - if: false
        run: pnpm exec jest --runInBand src/themes/__tests__/catalog-filters-sheet-choices.spec.ts
      # Шрифт «Группы товаров» — из «Настроек темы» (владелец 23.09: «надо
      # нормально сделать как в настройках темы сделано», «надо из настроек
      # темы»): каждая надпись секции — шрифтом текста, заголовок — шрифтом
      # заголовков, у фильтров ещё и жирностью текста, в CSS витрины. Было:
      # Manrope от rose у фильтров bloom/satin/flux, шрифт макета в шторках,
      # у bloom подзаголовок и счётчик «N товаров» — Manrope литералом.
      - if: false
        run: pnpm exec jest --runInBand src/themes/__tests__/catalog-font.spec.ts
      # Шапка, корзина и подвал — надписи шрифтами из «Настроек темы» (текста
      # или заголовков). Найдено 23.09 при проверке каталога: у bloom название
      # магазина и пустая корзина — системный шрифт и Manrope (классы ролей rose
      # без ролей в CSS bloom), у vanilla корзина и пункты мобильного меню —
      # Manrope (--font-nt-ui из токенов DS). Исключение — подпись платформы.
      - if: false
        run: pnpm exec jest --runInBand src/themes/__tests__/store-chrome-font.spec.ts
      # «Шрифт текста» и «Жирность текста» из «Настроек темы» доходят до карточек
      # товара в «Группе товаров» и «Коллекции товаров» пяти тем (владелец
      # 23.09: «как везде — такая же секция, по таким же правилам»). Перекрытие
      # tokens-css берёт надписи карточки по метке [data-nt$="-product-card"].
      - if: false
        run: pnpm exec jest --runInBand src/themes/__tests__/product-card-typography.spec.ts
      # «Продолжить покупки» пустой корзины ведёт на «общую» коллекцию магазина
      # (коллекция по умолчанию, в т.ч. переименованная), пять тем. Было (прод
      # 23.09): bloom — /skin-care, vanilla — /catalog/textile (заглушки вёрстки).
      - if: false
        run: pnpm exec jest --runInBand src/themes/__tests__/cart-continue-shopping.spec.ts
      # conformance:satin / check:css-layers / validate:page-seeds и загрузка
      # улик конформанса при падении переехали в satin-dictated-conformance —
      # они генерируют conformance-results/satin/report.json, и правильное
      # место для соответствующего upload-artifact теперь там же.
      # Числа каждого сегмента (сколько гардов, сколько проверок прошло) —
      # для сверки «сумма прошедших проверок ДО и ПОСЛЕ совпала», не только
      # для отладки красного. Пишется ci-satin-guards.mjs всегда, не только
      # при падении.
      - name: Upload guard totals (сегмент ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satin-guard-totals-shard-${{ matrix.shard }}
          path: conformance-results/ci-guard-totals-shard-*.json
          if-no-files-found: warn
          retention-days: 14

  # b51-ci-speed2: сборка тем ОДИН раз для всего прогона вместо одной на
  # каждый из пяти сегментов satin-structural-conformance плюс ещё одной в
  # satin-dictated-conformance. Раньше это была чистая потеря: три (теперь
  # пять) раннера трижды выполняли одну и ту же сборку (~65-70 с каждый).
  # Результат (dist/) уходит вниз по прогону артефактом satin-dist, который
  # скачивают обе джобы ниже (needs: satin-build).
  satin-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack prepare pnpm@10.14.0 --activate
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
      # Кэш dist по хэшу исходников: если ни темы/пакеты/исходники, ни сами
      # сборочные скрипты не менялись с прошлого прогона (тот же ключ уже
      # сохранён в кэше веткой/раном ранее), actions/cache восстанавливает
      # готовый dist/ и все шаги сборки ниже пропускаются целиком. Ключ
      # включает НЕ ТОЛЬКО themes/**+packages/**+src/**, но и сами
      # компилирующие скрипты + package.json/pnpm-lock.yaml: правка
      # scripts/compile-*.mjs (или апдейт зависимости) без правки темы тоже
      # меняет ВЫХОД сборки, и кэш обязан протухнуть вместе с ней — иначе
      # прогон тихо отдал бы устаревший dist/ всем джобам ниже.
      #
      # ТРИ пути, не один: `pnpm exec tsx scripts/run-theme-build.ts satin`
      # (ThemeBuildService) гоняет astro build ВНУТРИ themes/satin/ и кладёт
      # результат в themes/satin/dist/ (сама тема), А ОТДЕЛЬНО копирует его в
      # dist/theme-preview/satin и dist/theme-live/satin (общий репозиторный
      # dist/). satin-conformance-source-snapshot.spec.ts (satin-dictated-
      # conformance) проверяет themes/satin/dist/index.html НАПРЯМУЮ — первая
      # версия этой ветки кэшировала и артефактила только dist/ и уводила эту
      # проверку в КРАСНОЕ на чистом чекауте (живой прогон 35145471675).
      #
      # themes/satin/.astro/ — тоже обязателен, отдельным живым красным
      # прогоном (35146219166): `pnpm conformance:satin` хеширует ВСЮ папку
      # themes/satin рекурсивно (SATIN_THEME_DIGEST_INPUTS в
      # satin-source-adapter.ts), а DIGEST_EXCLUDES в source-snapshot.ts
      # исключает только node_modules/dist/conformance-* — не .astro. Кэш
      # Astro на диске существует и участвует в дайджесте у ЛЮБОГО раннера,
      # который прогнал astro build; отслеживаемый инвентарь
      # conformance/inventory/satin.generated.json пинит байты С учётом этого
      # кэша. На чистом чекауте satin-dictated-conformance без .astro в
      # артефакте дайджест по этим путям молча отсутствовал (ENOENT-
      # tolerant — не «0 байт», а «путь пропущен»), из-за чего кандидат не
      # совпал с зафиксированным инвентарём: «tracked inventory is stale
      # (byte mismatch with the current candidate)». Раньше это не всплывало,
      # потому что build-джоба и джоба-потребитель были ОДНОЙ и той же джобой
      # на одном раннере — .astro/ всегда был на месте, когда считался
      # дайджест.
      - name: Кэш dist по хэшу исходников тем
        id: dist-cache
        uses: actions/cache@v4
        with:
          path: |
            dist
            themes/satin/dist
            themes/satin/.astro
          key: >-
            satin-dist-${{ hashFiles('themes/**', 'packages/**', 'src/**',
            'scripts/compile-astro-blocks.mjs', 'scripts/compile-theme-sections.mjs',
            'scripts/compile-preview-tailwind.mjs', 'scripts/run-theme-build.ts',
            'src/generator/theme-build.service.ts', 'package.json', 'pnpm-lock.yaml') }}
      - if: steps.dist-cache.outputs.cache-hit != 'true'
        run: pnpm build
      - if: steps.dist-cache.outputs.cache-hit != 'true'
        run: pnpm build:blocks
      - if: steps.dist-cache.outputs.cache-hit != 'true'
        run: pnpm build:theme-sections satin
      - if: steps.dist-cache.outputs.cache-hit != 'true'
        run: pnpm exec tsx scripts/run-theme-build.ts satin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
      # Все пять тем — снимки секций и матрица цветовых схем в
      # satin-structural-conformance сравнивают темы между собой, а
      # test:conformance:shared (satin-dictated-conformance) держит на себе
      # ещё и bloom (conformance-source-snapshot.spec.ts). Нужен dist каждой.
      - if: steps.dist-cache.outputs.cache-hit != 'true'
        run: pnpm build:theme-sections:all
      - if: steps.dist-cache.outputs.cache-hit != 'true'
        run: pnpm build:preview-tailwind
      # include-hidden-files: true — ОБЯЗАТЕЛЕН. По умолчанию (false)
      # actions/upload-artifact молча вырезает из архива любой путь с
      # dot-компонентом — themes/satin/.astro целиком, без единого
      # предупреждения в логе. Живой пруф (третий красный прогон,
      # 35147152463): cache path из тех же трёх строк восстанавливал .astro
      # корректно (actions/cache архивирует через голый tar, dotfiles не
      # фильтрует), а artifact — нет, поэтому кэш-хит был бы зелёным, а
      # холодная сборка (артефакт) — снова «tracked inventory is stale».
      - name: Артефакт dist для остальных джоб
        uses: actions/upload-artifact@v4
        with:
          name: satin-dist
          path: |
            dist
            themes/satin/dist
            themes/satin/.astro
          include-hidden-files: true
          retention-days: 1

  # b51-ci-speed2: дословный хвост джобы satin-structural-conformance,
  # вынесенный в отдельную джобу. Раньше эти шаги гонялись один раз
  # (`if: matrix.shard == 1`), но СЕРИАЛЬНО после батча сегмента 1 — то есть
  # добавляли ~80 с строго К СЕГМЕНТУ 1, раздувая его непропорционально
  # остальным. Здесь они идут ПАРАЛЛЕЛЬНО всем десяти сегментам матрицы —
  # раньше распараллеливания не было (одна джоба = один runner на сегмент,
  # хвост жил в том же runner'е, что и батч), теперь это два независимых
  # раннера.
  #
  # Порядок команд ниже (кроме подготовительных checkout/install/download)
  # дословно сторожит scripts/__tests__/ci-theme-conformance-layout.test.mjs.
  # Раньше он сторожил их порядок ВНУТРИ satin-structural-conformance, теперь
  # — порядок ВНУТРИ этой джобы: ни одна команда не пропала и не поменялась
  # местами относительно других, изменилось только то, на каком раннере она
  # выполняется. Это НЕ ослабление гарда — оно по-прежнему падает, если кто-то
  # уберёт шаг, изменит его текст или переставит команды местами.
  satin-dictated-conformance:
    needs: satin-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack prepare pnpm@10.14.0 --activate
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
      # path: . (не path: dist!) — артефакт несёт dist/, themes/satin/dist/ И
      # themes/satin/.astro/. satin-conformance-source-snapshot.spec.ts
      # (test:conformance:satin ниже) читает themes/satin/dist/index.html
      # напрямую, а `pnpm conformance:satin` (тоже ниже) хеширует ВСЮ папку
      # themes/satin рекурсивно, включая .astro/ — без него дайджест не
      # совпадает с отслеживаемым conformance/inventory/satin.generated.json
      # («tracked inventory is stale», живой красный прогон 35146219166).
      - uses: actions/download-artifact@v4
        with:
          name: satin-dist
          path: .
      - run: pnpm test:conformance:shared
      - run: pnpm test:conformance:satin
      - run: node --test scripts/__tests__/block-source-layout.test.mjs
      - run: node --test scripts/__tests__/workspace-docker-layout.test.mjs
      # Остальные node:test-проверки из scripts/__tests__. Раннер у них
      # встроенный (node --test), конфига им не нужно — и ровно поэтому их
      # никто не подхватывал: в CI руками были вписаны только две строки выше.
      # 16 файлов, 647 проверок, ~11 c. Зелёные на origin/main.
      #
      # Вне списка сознательно оставлен flux-header-reference-contract.test.mjs:
      # он красный и ловит настоящее расхождение (Header главной flux уехал на
      # scheme-2 ревертом d6d9b1ca, а blockDefaults.PromoBanner.colorScheme
      # перебивает фирменный navy). Это правка тем, не теста.
      - name: Контракты исходников и утилит сборки (node:test)
        run: >-
          node --test
          scripts/__tests__/catalog-block-aspects.test.mjs
          scripts/__tests__/ci-theme-conformance-layout.test.mjs
          scripts/__tests__/compute-ranges.test.mjs
          scripts/__tests__/flux-home-contract.test.mjs
          scripts/__tests__/flux-section-source-contract.test.mjs
          scripts/__tests__/github-source.test.mjs
          scripts/__tests__/index-ts.test.mjs
          scripts/__tests__/migrate-block-to-tokens.test.mjs
          scripts/__tests__/registry.test.mjs
          scripts/__tests__/rewrite-base-classes.test.mjs
          scripts/__tests__/scheme-color-filter.test.mjs
          scripts/__tests__/snapshot-container.test.mjs
          scripts/__tests__/structural-dimension-filter.test.mjs
          scripts/__tests__/transform-utilities.test.mjs
          scripts/__tests__/utility-classify.test.mjs
          scripts/__tests__/validate-token-completeness.test.mjs
      - run: pnpm exec jest --runInBand src/generator/__tests__/pnpm-invocation.spec.ts
      - run: pnpm exec jest --runInBand src/themes/__tests__/block-artifact-resolver.spec.ts
      - run: pnpm exec jest --runInBand src/themes/__tests__/cart-drawer-contract.spec.ts
      - run: pnpm exec jest --runInBand src/themes/__tests__/preview-cart-contract.spec.ts
      # PR-19 — три точки расширений на витрине (cart/checkout/account):
      # контракт монтирования (theme-base блоки + legacy кабинет пяти тем) и
      # гард словаря (theme-base не называет расширения по домену).
      - run: pnpm exec jest --runInBand src/themes/__tests__/extension-points-contract.spec.ts src/__tests__/extension-vocabulary.spec.ts
      - run: pnpm conformance:satin
      - run: pnpm check:css-layers
      - run: pnpm validate:page-seeds
      - name: Upload Satin conformance evidence
        if: failure() && hashFiles('conformance-results/satin/report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: satin-structural-conformance
          path: conformance-results/satin
          if-no-files-found: error
          retention-days: 14

  deploy-to-coolify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-and-test
      - satin-build
      - satin-structural-conformance
      - satin-dictated-conformance
    runs-on: ubuntu-latest
    steps:
      - name: Deploy through the Coolify API
        # Вебхуком нельзя: при выключенном автодеплое Coolify его игнорирует, а
        # по ответу это не видно. И запрос в любом случае лишь ставит сборку в
        # очередь — 200 означает «принято», а не «выкатано»: 2026-09-15 так
        # прошли две зелёные выкатки, не доехавшие до прода (DEBT-31).
        #
        # Повтор — только на сигнатуре сетевого сбоя сервера (`api.github.com`
        # в логах Coolify). Сборку, упавшую по другой причине, повторять незачем.
        run: |
          set -euo pipefail
          api="http://200.169.180.243:8000/api/v1"
          auth="Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"

          for attempt in 1 2 3; do
            response=$(curl -fsS -X POST -H "$auth" \
              "$api/deploy?uuid=q40c8ww44ss4ckogo8w0csso&force=false")
            deployment=$(echo "$response" | jq -r '.deployments[0].deployment_uuid')
            if [ -z "$deployment" ] || [ "$deployment" = "null" ]; then
              echo "Coolify не вернул номер выкатки: $response"
              exit 1
            fi
            echo "попытка $attempt: выкатка $deployment поставлена в очередь"

            status=""
            for _ in $(seq 1 60); do
              sleep 15
              status=$(curl -fsS -H "$auth" "$api/deployments/$deployment" | jq -r '.status')
              echo "статус: $status"
              case "$status" in finished|failed|cancelled) break ;; esac
            done

            if [ "$status" = "finished" ]; then
              echo "выкатка дошла до конца"
              exit 0
            fi
            if [ "$status" != "failed" ] && [ "$status" != "cancelled" ]; then
              echo "::error::за пятнадцать минут выкатка не пришла к финальному статусу"
              exit 1
            fi

            logs=$(curl -fsS -H "$auth" "$api/deployments/$deployment" | jq -r '.logs')
            if echo "$logs" | grep -q 'api.github.com'; then
              echo "::warning::сервер не достучался до api.github.com — повторяю"
              continue
            fi
            echo "::error::выкатка завершилась статусом $status"
            echo "$logs" | tail -c 3000
            exit 1
          done

          echo "::error::три попытки подряд упали на сетевом сбое сервера"
          exit 1
