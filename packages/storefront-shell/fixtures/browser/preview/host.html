<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Конструктор — фикстура превью</title>
  </head>
  <body>
    <!-- Рамка превью, как в конструкторе (блок 8); data-loads — сколько раз загрузился её документ. -->
    <iframe
      id="preview"
      src="/preview/index.html?shell=__SHELL__"
      style="width: 800px; height: 600px"
      data-loads="0"
      onload="this.dataset.loads = String(Number(this.dataset.loads) + 1)"
    ></iframe>
    <pre id="answers"></pre>
    <script>
      // Ответы ядра из рамки — строкой JSON на ответ.
      window.addEventListener('message', (event) => {
        document.getElementById('answers').textContent += JSON.stringify(event.data) + '\n';
      });
    </script>
  </body>
</html>
