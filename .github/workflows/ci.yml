      # иконки платёжных систем). Замер пяти витрин и пяти превью показал, что
      # на текущем main этого нет — но обе дыры, через которые подвал приезжал,
      # были на месте, и прошлый круг их не закрывал:
      #   1) причина в ДАННЫХ: `migrateCheckoutPage` дописывает в страницу
      #      чекаута блок `Footer` — копию подвала главной вместе с id. Замер:
      #      extractPageBlocks(ревизия,'page-checkout') → [CheckoutHeader,
      #      CheckoutForm, CheckoutSummary, Footer]. Любой рендер ПО БЛОКАМ
      #      (в проде — фолбэк превью, когда у темы нет собранного шелла
      #      checkout/index.html) рисовал подвал витрины;
      #   2) причина в ИНЪЕКЦИИ: `replaceCheckoutFooterStrip` умела только
      #      подменить УЖЕ СТОЯЩУЮ полосу. Шелл с подвалом витрины возвращался
      #      байт-в-байт («Powered by» 1, <ul> 1, полосы нет) — молча, без warn.
      #      Отсюда и «прошлая правка не сработала»: она заменяла полосу на
      #      полосу, а убрать подвал витрины не умела.
      # Гард сторожит ПРИЧИНЫ: на странице с хромом checkout блоки хрома
      # витрины не являются телом, а инъекция обязана убрать подвал витрины и
      # поставить полосу (и дописать её, если подвала нет вовсе — прежний
      # симптом flux). Плюс калибровка: подвал витрины темы действительно
      # несёт эти маркеры, иначе проверка сторожила бы пустоту.
      # Саботаж проверен: возврат блока в тело чекаута красит 4 проверки,
      # возврат «умеем только подменять» — 2.
      # Рендерит СКОМПИЛИРОВАННЫЕ блоки и секции тем → нужны pnpm build:blocks
      # и pnpm build:theme-sections выше по джобу (они там есть).
      - run: pnpm exec jest --runInBand src/themes/__tests__/checkout-no-storefront-footer.spec.ts
      - run: pnpm conformance:satin
      - run: pnpm check:css-layers
      - run: pnpm validate:page-seeds
      - name: Upload Satin conformance evidence
        if: failure() && hashFiles('conformance-results/satin/report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: satin-structural-conformance
          path: conformance-results/satin
          if-no-files-found: error
          retention-days: 14

  deploy-to-coolify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-and-test
      - satin-structural-conformance
    runs-on: ubuntu-latest
    steps:
      - name: Call Coolify deploy webhook
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: >-
          curl
          --fail-with-body
          --silent
          --show-error
          --request GET
          "$COOLIFY_DEPLOY_WEBHOOK"
          --header "Authorization: Bearer $COOLIFY_TOKEN"
