name: theme-parity

# Пути включают themes/** — живые порты тем лежат именно там, а не только в
# packages/theme-**; без этого визуальный диф ни разу не запускался на правках
# секций. И триггер на push в main: работа идёт прямо в main, PR почти не
# создаётся, а проверка, которая не запускается, ничего не проверяет.
# Список путей продублирован: YAML-якоря в workflow GitHub Actions не работают.
on:
  push:
    branches: ["main"]
    paths:
      - 'themes/**'
      - 'packages/theme-**'
      - 'src/controllers/preview*'
      - 'src/services/preview*'
      - 'src/themes/**'
      - '.github/workflows/theme-parity.yml'
      - 'scripts/qa/**'
  pull_request:
    paths:
      - 'themes/**'
      - 'packages/theme-**'
      - 'src/controllers/preview*'
      - 'src/services/preview*'
      - 'src/themes/**'
      - '.github/workflows/theme-parity.yml'
      - 'scripts/qa/**'

permissions:
  contents: read
  packages: read

# Замеры идут по темам параллельно (spec 115, 25.09): одна джоба на все пять
# тем шла 12–13 минут — боковое меню 216 с, зазоры секций 336 с. Правила
# замеров считаются по клетке (тема × сценарий или тема × ширина), поэтому
# тема в отдельной джобе проверяется ровно так же: 5 × 10 клеток меню и
# 5 × 54 клетки зазоров — те же 50 и 270, что в одной джобе.
#
# Визуальное сравнение с эталонами Figma (`pnpm visual-diff:themes`) убрано
# 25.09 по решению владельца и записано в долг spec 115. Оно не проверяло
# ничего — «pass 0, fail 0» из 100: секрета MONOREPO_REF_TOKEN нет, эталоны не
# скачивались, а снимало оно прод (PREVIEW_BASE=https://gateway.merfy.ru), а
# не код ветки. Вернуть, когда эталоны будут в CI, а превью будет сниматься
# из кода ветки.
jobs:
  theme-qa:
    name: theme-qa (${{ matrix.theme }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        theme: [rose, bloom, flux, satin, vanilla]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Configure GitHub Packages auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
        run: >-
          pnpm config set
          "//npm.pkg.github.com/:_authToken"
          "$NODE_AUTH_TOKEN"
          --location=user

      - name: Install deps
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps

      # Боковое меню глазами человека (документ «баги бокового меню», 22.09):
      # на телефоне панель во весь экран, шапка одна, панель от верха экрана и
      # после ресайза, в шапке панели только корзина, панель листается, а
      # страница под ней нет, стрелка раскрывает вложенные и не закрывает меню.
      # Всё это про то, что лежит сверху и куда уходит нажатие, — нужен браузер;
      # статический сканер шапки (header-menu-scan в ci.yml) этого не видит.
      # Chromium уже стоит шагом выше, поэтому замер живёт здесь, а не в ci.yml.
      - name: Сборка секций для замера бокового меню
        run: pnpm build && pnpm build:blocks && pnpm build:theme-sections:all

      - name: Боковое меню — правила от лица человека (${{ matrix.theme }})
        run: pnpm qa:side-menu --theme=${{ matrix.theme }}

      # Владелец 23.09: отступы между секций и «Отступы» секции («Каталог» на
      # страницах коллекции и каталога) показывали фон страницы — Схему 1 —
      # вместо схемы секции. Замер по пикселям снимка: зазор окрашен схемой
      # нижней секции, сквозь «Отступы» любой секции фон страницы не виден.
      - name: Отступы и зазоры секций — в цвет своей схемы (${{ matrix.theme }}, 2 ширины)
        run: pnpm qa:section-gaps --theme=${{ matrix.theme }}
