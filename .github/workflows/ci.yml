name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sites_service
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sites_service"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.14.0

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure GitHub Packages auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
        run: >-
          pnpm config set
          "//npm.pkg.github.com/:_authToken"
          "$NODE_AUTH_TOKEN"
          --location=user

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare environment variables
        run: |
          cat <<'EOF' > .env.local
          POSTGRES_PASSWORD=postgres123
          POSTGRES_DB=sites_service
          POSTGRES_USER=postgres
          DATABASE_URL=postgresql://postgres:postgres123@localhost:5432/sites_service
          NODE_ENV=test
          EOF

      - name: Wait for Postgres
        run: |
          for i in {1..10}; do
            if nc -z localhost 5432; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres..."
            sleep 3
          done
          echo "Postgres failed to start" >&2
          exit 1

      - name: Run database migrations
        run: pnpm run db:migrate

      - name: Run lint
        # Existing main has repository-wide Prettier/type-aware ESLint debt.
        # Keep it visible without blocking deploys until that debt is cleaned up.
        continue-on-error: true
        run: pnpm run lint:check

      - name: Lint Rose heading regression tests
        run: >-
          pnpm exec eslint
          src/generator/__tests__/rose-heading-size.spec.ts
          src/themes/__tests__/page-blocks-heading-size.spec.ts

      - name: Run build
        run: pnpm run build

      # Ниже — проверки, которые лежали в репозитории и не гонялись НИ ОДНОЙ
      # джобой (аудит 13.09). Джоба build-and-test до этого не запускала ни
      # одного теста вообще: поднимала Postgres, катала миграции, собирала — и
      # всё. Сюда положены только те группы, которым не нужны артефакты тем:
      # они считаются по исходникам, идут секунды и на origin/main зелёные.

      # Миграции ревизий переписывают данные мерчанта при КАЖДОМ чтении: цена
      # ошибки — молча испорченная страница у живого магазина. Три файла из
      # этой папки уже сторожила джоба satin, остальные одиннадцать — нет.
      # 14 файлов, 116 проверок, ~4 c.
      - name: Тесты миграций ревизий
        run: pnpm exec jest --runInBand src/utils/__tests__/

      # Контракт тем: схема манифеста, реестр токенов, резолвер страниц,
      # конформанс-движок. Джоба satin гоняла отсюда только conformance-*
      # (9 сьютов из 40). 39 сьютов, 418 проверок, ~3 c.
      #
      # cli-validate.test.ts СОЗНАТЕЛЬНО оставлен вне этого шага и остаётся
      # красным: он ловит настоящую поломку — packages/theme-bloom/theme.json
      # объявляет токен `--product-card-padding`, которого нет в TOKEN_REGISTRY,
      # и CLI падает на нём раньше, чем доходит до проверяемого сообщения.
      # Чинить надо манифест, а не тест; до тех пор вешать на джобу вечно
      # красный шаг нельзя — такую джобу перестают читать.
      - name: Тесты пакета theme-contract
        working-directory: packages/theme-contract
        # cli-validate исключён осознанно: он ловит НАСТОЯЩУЮ поломку — токен
        # --product-card-padding не зарегистрирован в TOKEN_REGISTRY, из-за чего
        # CLI падает на манифестах flux (16 расхождений), rose (22), satin и
        # bloom (по 1). Пока токен не заведён, шаг был бы вечно красным, а
        # вечно красную джобу перестают читать. Починка — в плане, P3.
        run: >-
          pnpm exec jest --config jest.config.ts --runInBand
          --testPathIgnorePatterns 'cli-validate'
          --testPathIgnorePatterns "/node_modules/" "/__tests__/fixtures/"
          "__tests__/cli-validate.test.ts"

      # Манифест vanilla — единственный из пяти, который проходит
      # ThemeManifestSchema (у flux 16 расхождений, у rose 22, у satin и bloom
      # по одному). Замок ставим на то, что уже чисто, чтобы не уехало и оно.
      - name: Тесты манифеста темы vanilla
        working-directory: packages/theme-vanilla
        run: pnpm exec jest --config jest.config.ts --runInBand

  satin-structural-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack prepare pnpm@10.14.0 --activate
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
      - run: pnpm build
      - run: pnpm build:blocks
      - run: pnpm build:theme-sections satin
      - run: pnpm exec tsx scripts/run-theme-build.ts satin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
      # Снимки HTML секций по пяти темам: ловят «починили одно — сломали три»
      # в момент правки, а не через день у тестера. Секции собираются для всех
      # тем, а не только для satin, иначе сравнивать не с чем.
      - run: pnpm build:theme-sections:all
      - run: pnpm test:section-snapshots
      # Глаз у именованного параметра: секция рендерится дважды — обычно и со
      # скрытым полем. Снимки этого не ловят: они рендерят без hiddenFields.
      - run: pnpm test:hidden-fields
      # Item-уровневый «глаз»: точечный hot-render блока обязан отбрасывать
      # скрытые элементы так же, как страница превью и сборка витрины.
      - run: pnpm test:hidden-items
      # Галерея: канон — три плитки, а ревизия с четырьмя и больше обязана
      # разбираться и рисовать три, а не умирать.
      - run: pnpm test:gallery-count
      # Свежий магазин: секция обязана рисоваться СРАЗУ, без правки мерчанта.
      # Баг владельца 14.09 — «галерея не отображается, пока не выполнишь любое
      # действие с секцией». Причина была в данных, а не в рендере: стриппер
      # демо-контента (spec 099) снимал у сида `items`, а порты всех пяти тем
      # рисуют плитки строго по `items` — секция уезжала к мерчанту пустой,
      # хотя в дереве конструктора три её плитки были видны (фолбэк на
      # defaultProps). Гард держит инвариант «рендер нетронутой секции = рендер
      # после первой правки» и отдельно — что удалённые плитки не воскресают.
      - run: pnpm test:fresh-sections
      # Состав параметров секций менять нельзя (владелец, 2026-09-13). Гард
      # сверяет фактический состав панелей пяти тем со снимком
      # conformance/panel-canon.json и падает с именем темы, блока и поля.
      - run: pnpm test:panel-canon
      # «Отступы» обязаны рисоваться НАШИМ контролом (PaddingControl — два
      # слайдера «Сверху»/«Снизу»), а не двумя голыми числовыми инпутами с
      # английскими подписями top/bottom. Владелец, 2026-09-14 по скриншоту
      # сайдбара секции «Вход»: «Сайдбар привести к виду. Инпуты, отступы
      # должны быть наши». Ломалось так: блок объявлял отступы как
      # `{ type: 'object' }` без objectFields, и подполя достраивал сам сервис
      # (hydrateFields в theme-puck-config.controller.ts), подписывая их сырым
      # ключом. panel-canon такое НЕ ловит: он сторожит совпадение со снимком,
      # а снимок был снят с уже сломанного состояния. Этот гард сторожит
      # ПРИЧИНУ — в исходниках блоков и в отданном конфиге пяти тем.
      - run: pnpm test:padding-control
      # Секция «Избранное» (тестировщик 14.09): в панели ровно два параметра —
      # «Цветовая схема» и «Отступы», — и живёт она ТОЛЬКО на своей странице.
      # panel-canon сторожит состав панели, но не отвечает на вопрос «а на
      # других страницах её точно нет»: это держится на сидах страниц и на
      # сидере ревизий, и проверяется здесь.
      - run: pnpm test:wishlist-section
      # Секции «Личный кабинет» и «Заказы» (тестировщик 14.09): в панели каждой
      # РОВНО ОДИН параметр — «Цветовая схема», — и живут они ТОЛЬКО на своих
      # страницах (/account/profile и /account/orders). panel-canon сторожит
      # состав панели, но не отвечает на вопрос «а на других страницах их точно
      # нет»: это держится на сидах страниц и на сидере ревизий, и проверяется
      # здесь. Лок кнопки «Добавить секцию» на этих страницах — предмет теста в
      # backend/services/constructor (account-sections-page-scope.test.ts).
      - run: pnpm test:account-sections
      # Превью тех же двух страниц должно показывать ТЕЛО, а не форму входа
      # (владелец 14.09). Inline-клиент секции начинает с гость-гейта, а navTo
      # внутри iframe переписывает `?page=` у самого превью — конструктор
      # перерисовывался страницей «Вход», и настроить секцию было нельзя.
      # Гард ИСПОЛНЯЕТ оба inline-скрипта секции на крошечном DOM-стенде в двух
      # контекстах: превью (глобал есть — навигации нет, тело заполнено) и
      # витрина-гость (глобала нет — навигация на /login ЕСТЬ). Второй случай
      # сторожит, что послабление превью не сняло защиту витрины.
      - run: pnpm test:account-preview-body
      # Секция «Вход» (владелец 14.09): у страницы /login появилось собственное
      # тело — magic-link форма темы, — и в панели РОВНО ЧЕТЫРЕ параметра:
      # «Заголовок», «Текст», «Цветовая схема», «Отступы». panel-canon сторожит
      # состав панели, но не отвечает на два других вопроса: доезжают ли
      # «Заголовок»/«Текст»/«Отступы» до разметки (мёртвая настройка) и живёт ли
      # секция ТОЛЬКО на своей странице. Это проверяется здесь. Пункт меню
      # «Профиль → Вход» и лок кнопки «Добавить секцию» — предмет теста в
      # backend/services/constructor (login-section-page-scope.test.ts).
      - run: pnpm test:login-section
      # Цветовая схема секций-страниц аккаунта красит ВСЮ высоту между шапкой
      # и подвалом (владелец, 14.09: «Секция заказы не применяется до конца
      # цветовая схема», «Секция Личный кабинет не применяется до конца цветовая
      # схема»). Замер «до» (Chromium 1280×1400, задеплоенное превью sites,
      # main ed3d5948) — ЩЕЛЬ между низом секции и низом растянутого <main>,
      # то есть высота светлой полосы фона страницы:
      #             orders  profile  wishlist  login
      #   rose         422      91       424     314
      #   flux         149       0       140      49
      #   vanilla      398      73       459     298
      #   bloom        339      14       325     239
      #   satin        314       0       308     214
      # Схема при этом применялась (фон секции = цвет схемы) — не доставало
      # растяжения: sticky-footer растягивает <main>, а обёртка схемы и секция
      # сайзились по контенту. Замер «после» (тот же скрипт, tokens.css
      # пересобран): ЩЕЛЬ=0 во всех 20 клетках, заголовок секции не сдвинулся
      # ни в одной, высота документа не изменилась ни в одной, и 25 страниц без
      # поверхности аккаунта (главная/каталог/товар/корзина/чекаут × 5 тем)
      # совпали побайтно по раскладке.
      # Браузера в CI нет → гард стоит на том, ЧЕМ геометрия определяется: три
      # звена цепочки в единственном источнике tokens.css плюс живой рендер
      # четырёх секций в пяти темах (их data-block обязан быть в списке
      # правила) и composeV2Page (обёртка схемы — прямой ребёнок <main>).
      # Саботаж (проверено руками, браузером тоже): любое НЕПОЛНОЕ сочетание
      # звеньев оставляет полосу ровно прежней (423/140/298), закрывает её
      # только полная тройка.
      - run: pnpm test:account-surface
      # Шапка и подвал на собранной странице — по одному. Замер живых витрин
      # 14.09: на 34 сочетаниях страница×тема из 35 шапки было ДВЕ, вложенных
      # друг в друга: composeContentPagesIntoDist кладёт мерчантский блок
      # «Шапка», а injectChromeIntoHtml подменял ВНУТРЕННИЙ <header> блоком
      # ЦЕЛИКОМ. Приём вдобавок не был идемпотентным и наращивал по слою за
      # прогон. Гард идёт по настоящему пути (реальный рендер порта +
      # composeV2Page + injectChromeIntoHtml), поэтому стоит после
      # build:theme-sections:all.
      - run: pnpm test:single-chrome
      # Подпанель «Слайд»: состав и типы контролов по эталону b11d0487 плюс
      # рендер-пруф «Затемнения». Состав уже терялся молча — слиянием 283acab2,
      # где конфликт по Slideshow.puckConfig разрешили в пользу старой ветки.
      - run: pnpm test:slide-panel
      # Промо-баннер: контрола «Регистр текста» в панели нет, а текст остаётся
      # таким, каким мерчант его ввёл.
      - run: pnpm test:promo-banner-panel
      # Item-уровневый «глаз» в дереве и дефолты контролов сайдбара: оба теста
      # лежали в репозитории и не гонялись ни одной джобой — значит не
      # сторожили ничего (та же болезнь, что у rich-text-bold-italic).
      - run: pnpm test:hidden-list-items
      - run: pnpm test:panel-defaults
      # Порядок медиафайлов секции «Товар»: клик по миниатюре меняет только
      # отображаемое фото героя, позиции файлов неизменны. Оба порта секции
      # (общий theme-base и собственный flux) держат один контракт.
      - run: pnpm test:media-order
      # «Увеличение» секции «Товар»: настройка доезжала до разметки
      # (data-zoom-mode), но читать её было некому — в макете по умолчанию «2
      # колонки» героя нет, а проводка висела на нём, поэтому ни «Наведение», ни
      # «Нажатие» не давали ни обработчика, ни курсора (баг тестировщика
      # 2026-09-13, п.1). Гард держит оба порта секции.
      - run: pnpm test:zoom-wiring
      # Образцы вариаций: составное имя цвета («Светло-голубой») оставалось
      # текст-кнопкой, потому что цвет искался ТОЧНЫМ совпадением со словарём —
      # из девяти образцов формой «Круг» становились восемь. Гард держит класс
      # имён (дефис, регистр, ё/е, пробелы, падежи) в обоих портах.
      - run: pnpm test:variant-colors
      # Форма образца вариаций в «Списке»: при «Стиль: Список» настройка
      # «Вариации» (Круг/Квадрат) пропадала вместе с самими образцами —
      # мерчант видел голую выпадашку (баг тестировщика 2026-09-14). Корень
      # один на оба порта: ветка «Списка» формы не получала (theme-base
      # схлопывал два поля панели в один legacy-enum, flux звал выпадашку,
      # у которой параметра формы нет в сигнатуре). Гард держит ВСЕ сочетания
      # «стиль × форма» по пяти темам и меряет эффективный радиус образца
      # (значение из CSS темы либо inline-стиль), а не наличие класса: форму
      # темы доставляют разными механизмами.
      - run: pnpm test:variant-shape
      # НАЛОЖЕНИЕ на том же раскрытом списке (тестировщик 14.09, «съезжает при
      # настройке круг и квадрат»): счётчик «− 1 +» и «Добавить в корзину»
      # печатались ПОВЕРХ пунктов. Гард выше этого не ловит — он меряет форму и
      # размер образца, а не геометрию слоёв. Причина не в блоке: подсветка
      # подсекций в превью вешала `position:relative` + `z-index:3/4` на КАЖДУЮ
      # обёртку параметра секции, то есть контекст наложения; при равном z-index
      # порядок решает дерево, и «Количество» с «Кнопками» рисовались поверх
      # «Вариантов» вместе с запертым внутри списком (z-index:20 бессилен).
      # Замер Chromium «до»: 10 точек из 10 внутри пересечения отдавал сосед во
      # всех пяти темах и обеих формах; «после» — 0 из 10.
      # Сторожим СЛЕДСТВИЕ по реальным бандлам превью: ни один предок раскрытого
      # списка не создаёт контекста наложения и не режет содержимое, сам список
      # позиционирован с положительным z-index, а соседние обёртки
      # позиционированы (иначе проверка сторожила бы пустоту). Значения берутся
      # победителем каскада в dist/preview-tailwind.css + dist/theme-css/<тема>.css
      # и инлайн-стилем узла: порт flux доставляет слой инлайном, theme-base —
      # утилитами, и «есть класс z-20» слепо на одном из двух.
      # Нужен бандл превью — витринные сборки его не содержат.
      - run: pnpm build:preview-tailwind
      - run: pnpm test:variant-overlap
      # Карточка товара в сетке «Коллекции товаров» (жалобы тестировщика 13.09):
      # «Вид изображения» обязан менять пропорции карточки, «Количество» —
      # рисовать счётчик, а состав опций «Стиля кнопки» остаётся каноном (там
      # нет и не было значения «Широкий»). Пропорция считается как в браузере —
      # победитель каскада на медиа-боксе, а не поиск класса в разметке: темы
      # доставляют её тремя разными механизмами, и проверка «есть класс»
      # слепа на двух из трёх.
      - run: pnpm test:collection-card
      # «Группа товаров» (блок Catalog) красится ОДНОЙ схемой. Тестировщик
      # 14.09, санкционировано владельцем: «в сайдбаре и настройке убрать
      # цветовую схему контейнера». Гард держит три вещи сразу: в панели пяти
      # тем ровно один контрол схемы; порт не печатает вложенный класс, даже
      # если старая ревизия принесёт containerColorScheme строкой или числом;
      # подложка, которая держит заливку секции, осталась на месте — секция
      # обязана краситься целиком, а не потерять фон.
      - run: pnpm test:catalog-scheme
