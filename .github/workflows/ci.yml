      # расчётные края шапки и секции на лестнице вьюпортов с допуском 1px.
      - run: pnpm test:rose-header-grid
      - run: pnpm test:conformance:shared
      - run: pnpm test:conformance:satin
      - run: node --test scripts/__tests__/block-source-layout.test.mjs
      - run: node --test scripts/__tests__/workspace-docker-layout.test.mjs
      # Остальные node:test-проверки из scripts/__tests__. Раннер у них
      # встроенный (node --test), конфига им не нужно — и ровно поэтому их
      # никто не подхватывал: в CI руками были вписаны только две строки выше.
      # 16 файлов, 647 проверок, ~11 c. Зелёные на origin/main.
      #
      # Вне списка сознательно оставлен flux-header-reference-contract.test.mjs:
      # он красный и ловит настоящее расхождение (Header главной flux уехал на
      # scheme-2 ревертом d6d9b1ca, а blockDefaults.PromoBanner.colorScheme
      # перебивает фирменный navy). Это правка тем, не теста.
      - name: Контракты исходников и утилит сборки (node:test)
        run: >-
          node --test
          scripts/__tests__/catalog-block-aspects.test.mjs
          scripts/__tests__/ci-theme-conformance-layout.test.mjs
          scripts/__tests__/compute-ranges.test.mjs
          scripts/__tests__/flux-home-contract.test.mjs
          scripts/__tests__/flux-section-source-contract.test.mjs
          scripts/__tests__/github-source.test.mjs
          scripts/__tests__/index-ts.test.mjs
          scripts/__tests__/migrate-block-to-tokens.test.mjs
          scripts/__tests__/registry.test.mjs
          scripts/__tests__/rewrite-base-classes.test.mjs
          scripts/__tests__/scheme-color-filter.test.mjs
          scripts/__tests__/snapshot-container.test.mjs
          scripts/__tests__/structural-dimension-filter.test.mjs
          scripts/__tests__/transform-utilities.test.mjs
          scripts/__tests__/utility-classify.test.mjs
          scripts/__tests__/validate-token-completeness.test.mjs
      - run: pnpm exec jest --runInBand src/generator/__tests__/pnpm-invocation.spec.ts
      - run: pnpm exec jest --runInBand src/themes/__tests__/block-artifact-resolver.spec.ts
      - run: pnpm exec jest --runInBand src/themes/__tests__/cart-drawer-contract.spec.ts
      # Цветовая схема сайдбара корзины (просьба владельца 13.09). Сторожит не
      # «поле появилось», а ЖИВОСТЬ: настройка обязана быть источником схемы для
      # дровера и красить его во всех пяти темах. Замер в Chromium показал, что
      # до правки дровер не перекрашивался нигде, кроме vanilla, — правила
      # портов лежат в @layer base и проигрывают утилите `bg-white` из
      # дизайн-пакета. Поэтому тест отдельно проверяет, что покраска идёт БЕЗ
      # слоя и повторяет набор частей, объявленный портами.
      - run: pnpm exec jest --runInBand src/themes/__tests__/cart-drawer-scheme.spec.ts
      # Белая полоса по всему магазину при клике на «Подвал» (тестировщик
      # 13.09). Агент превью звал `scrollIntoView`, а тот по спецификации
      # прокручивает ВСЮ цепочку предков — включая документ конструктора за
      # границей кадра. Подвал последний: внутренний документ уже внизу,
      # остаток добирался прокруткой канваса, кадр уезжал вверх и снизу
      # открывался белый фон коробки. Тест сторожит оба конца: агент пяти тем
      # не содержит `scrollIntoView`, а замена доскроллит ровно туда же и
      # упирается в низ СВОЕГО документа.
      - run: pnpm exec jest --runInBand src/services/__tests__/preview-agent-frame-scroll.spec.ts
      # Подпись опции «Дополнительная» в «Мультирядах» (просьба владельца 13.09)
      # — по всем пяти темам, плюс запрет на возврат слова «Вторичная» в любую
      # панель любой темы. Канон-гард ловит состав, но не бережёт от того, что
      # старую подпись вернут соседней секцией.
      - run: pnpm exec jest --runInBand src/themes/__tests__/multirows-button-label.spec.ts
      - run: pnpm exec jest --runInBand src/themes/__tests__/preview-cart-contract.spec.ts
      # Чекаут и корзина, баг-репорт 12/16/17. Сторожат три расстыковки, каждая
      # из которых жила при зелёном CI:
      #   - превью конструктора отдавало чекаут без мерчантской шапки и без схем
      #     секций (их применяла ТОЛЬКО live-сборка);
      #   - `migrateCartPage` стирала «Промежуточный итог», который сеют темы;
      #   - сводка чекаута стояла в верху колонки и уезжала с первым скроллом.
      # Плюс баг-репорт 18, три пункта тестировщика по чекауту:
      #   18-А — подвал чекаута был маркетинговой полосой «Powered by Merfy»
      #     (у flux подвала не было вовсе). 14.09 владелец снял подвал совсем
      #     («УДАЛИТЬ В ЧЕКАУТЕ» про чёрную полосу копирайта): правовая
      #     информация страницы оплаты живёт в блоке условий под кнопкой, а
      #     снятие подвала витрины стало безусловным — иначе 18-А вернётся;
      #   18-Б — липкую сводку резал `max-height` + свой скролл: на 30 позициях
      #     прокрутка страницы доставала только до 9-10 из них;
      #   18-В — правка «Цветовой схемы» секций чекаута не доезжала до превью:
      #     у мега-блоков не было `data-puck-component-id`, и `update-block`
      #     конструктора не находил секцию («keep old DOM»).
      # Гард подвала рендерит СКОМПИЛИРОВАННЫЙ блок → нужен pnpm build:blocks
      # выше по джобу (он там есть).
      - run: >-
          pnpm exec jest --runInBand
          src/themes/__tests__/checkout-chrome-parity.spec.ts
          src/themes/__tests__/checkout-summary-sticky.spec.ts
          src/themes/__tests__/checkout-footer-legal.spec.ts
          src/themes/__tests__/checkout-block-identity.spec.ts
          src/utils/__tests__/revision-migrations-cart.test.ts
      # Третий круг тестировщика (те же пункты в третий раз). Каждый гард стоит
      # на том слое, где замер прода показал разрыв, а не там, где удобно:
      #   п.1 — тоггл «Контейнер» у «Сворачиваемого раздела» писал ЛЕГАСИ-ключ
      #     `container.enabled`, а порт читал канон `containerEnabled` (дефолт
      #     "false") → контейнер в рендере выключен всегда, класс схемы не
      #     печатался НИКОГДА. Фикстуры теста — дословный payload с прода;
      #   п.2 — параметры шапки прошлый круг выровнял, а НАБОР СЕКЦИЙ группы
      #     «Шапка» — нет: промо-баннер лежал на части страниц (rose 5 из 11,
      #     flux/bloom только на главной). Гард стоит и на миграции, и на сидах;
      #   п.4 — «очень плохо работают цветовые схемы» на чекауте: схема красила
      #     прозрачную секцию (или пятно под формой), а не КОЛОНКУ; у
      #     vanilla/satin/flux поверхности не было вовсе — колонка обрывалась на
      #     1079px из 1280. Плюс класс схемы пропадал на числовом значении.
      - run: >-
          pnpm exec jest --runInBand
          src/themes/__tests__/checkout-and-container-round3.spec.ts
          src/themes/__tests__/checkout-scheme-surface.spec.ts
          src/themes/__tests__/header-group-seeds.spec.ts
          src/utils/__tests__/header-group-round3.test.ts
          src/services/__tests__/preview-checkout-column-scheme.spec.ts
      # Шапка оформления — ОТДЕЛЬНАЯ полоса над обеими колонками (владелец,
      # 14.09, п.3: «отделить от левой и правой части и придать свои размеры»).
      # Это отмена решения третьего круга: тогда шапку увели внутрь левой
      # колонки, потому что полоса над цветной сводкой была БЕЛОЙ — её схему
      # гасили. Причина белизны снята: полоса снова несёт свою «Цветовую схему».
      # Замер «до» (собранные витрины пяти тем + доводка хрома, Chromium,
      # 1440×900, корзина 3 позиции): шапка x=274 y=0 w=446 — внутри колонки
      # формы (0..720). Замер «после»: x=0 y=0 w=1440 над обеими колонками,
      # колонки с y=84-86. Браузера в CI нет, поэтому гард стоит на том, ЧЕМ
      # геометрия задана: шапка обязана лежать в своей полосе перед строкой
      # колонок и не внутри ни одной из них, а подмена мерчантской шапки
      # (chrome-assembler) обязана попадать туда же. Саботаж повторяет прежнюю
      # раскладку (шапка внутри колонки) и требует, чтобы предикат её отверг.
      - run: pnpm exec jest --runInBand src/themes/__tests__/checkout-header-strip.spec.ts
      # ЧЕТВЁРТЫЙ КРУГ по странице «Оформление заказа» — пять пунктов владельца
      # (14.09) одним гардом, у каждого свой замер «до» и свой саботаж:
      #   п.1 «секция Подвал не присвоена ни к чему → присвоить к юр инфе»:
      #       схема узла «Подвал» не меняла цвет юр.инфы ни в одной из пяти тем;
      #   п.2 «Сводка заказа не в полный размер всей правой части»: колонка
      #       720×1276-1298, секция 468×462-464 со сдвигом 48/88px;
      #   п.3 см. шаг выше;
      #   п.4 «применяются только заданые цветовые схемы от тем, а при измении
      #       их не принимает новые условия»: мерчант перекрасил схему-4
      #       (Фон #71C0FF) — фон колонки остался заводским во всех пяти темах
      #       (rose/flux 26,26,26; satin 8,2,0; vanilla 255,255,255;
      #       bloom 247,247,249), потому что поверхность берётся из `surfaceBg`,
      #       а поля для него в редакторе схем НЕТ;
      #   п.5 «к секции Оформление закаказа не применяется никакая цветовая
      #       схема»: выбор схемы не менял на левой половине ничего у 4 тем из 5.
      - run: pnpm exec jest --runInBand src/themes/__tests__/checkout-sections-round4.spec.ts
      # Секция «Оформление заказа» = ВСЯ левая колонка (владелец, 14.09, п.1 из
      # трёх по странице оформления: «Оформление заказа секция идет все левое
      # пространство до кнопки оплаты»). Замер «до» (собранные витрины пяти тем
      # + сборка хрома, Chromium, 1440×900 и 390×844, корзина 3 позиции):
      # колонка формы 0..720, а секция в ней 298..692 — полоска 394px по центру
      # колонки; на мобилке 16..374 из 0..390. То есть секция была КАРТОЧКОЙ
      # внутри колонки — ровно то, что канон чекаута запрещает («поверхность от
      # края до края», только про границы секции, а не про заливку).
      # Причина: меру держала ОБЁРТКА колонки (max-width 446px + прижатие
      # вправо), и секция с `w-full` шире неё быть не могла. Мера переехала на
      # содержимое (шапка + под-секции формы) теми же числами, поэтому поля не
      # сдвинулись: замер «после» — секция 0..720, а кнопка/условия/поля как
      # были 298..692 (390: 16..374), все пять тем.
      # Браузера в CI нет → гард разрешает КАСКАД общего CHECKOUT_SPLIT_CSS и
      # проверяет победившие значения. Саботаж возвращает прежнее правило
      # дословно и требует, чтобы предикат его отверг.
      - run: pnpm exec jest --runInBand src/themes/__tests__/checkout-form-fills-column.spec.ts
      # Баг владельца (14.09): «при изменении цветовой схемы шапки во вкладке
      # Оформление заказа сбрасывается логотип». Замер двух путей рендера на
      # одной ревизии: страница превью отдаёт <img src=логотип>, а точечный
      # hot-render (POST /preview/block, дёргается на ЛЮБУЮ правку поля панели)
      # — текст siteTitle, причём дефолтный «Мой магазин». Данные ревизии целы:
      # логотип живёт в home.Header.props.logo, в панели «Шапки оформления»
      # поля логотипа нет вовсе. Терялось В РЕНДЕРЕ — первичный путь обогащал
      # пропсы ревизией (assembleChrome), точечный отдавал сырые.
      # Гард стоит на ОБЩЕМ строителе пропсов (оба пути обязаны звать его) и на
      # разводке, потому что класс бага — «у хрома два разных сбора пропсов», а
      # не одно поле: под тем же риском были logoImage, logoMode и siteTitle.
      # Рендерит скомпилированный блок → нужен pnpm build:blocks выше по джобу.
      - run: pnpm exec jest --runInBand src/themes/__tests__/checkout-header-hot-render.spec.ts
      # Хранимая XSS в «Условиях» чекаута (найдено 14.09). Настройка мерчанта
      # «Текст (поддерживает [текст](url))» уходила в set:html голой склейкой
      # `<a href="${url}">${label}</a>` — без санитайзера. Вектора:
      # [x](javascript:alert(1)), [x](data:text/html,…), [x](" onmouseover="…),
      # и просто <img src=x onerror=…> в тексте. Бьёт по ПОКУПАТЕЛЮ на шаге
      # оплаты, а не по мерчанту. Закрыто общим allow-list `sanitize-html`
      # (theme-base/runtime/rich-text: sanitizeInlineWithLinks + safeHref) —
      # тем же механизмом, что sanitizeInline и Page.sanitize, не третьим.
      # Гард закрывает КЛАСС: тот же прогон проверяет остальные ссылочные стоки
      # чекаута (authLinkHref контактов, ссылки шапки, правовые ссылки подвала).
      # Саботаж-проверка: вернули склейку — 7 проверок краснеют (проверено).
      # ВНИМАНИЕ: функции гоняются по dist/astro-blocks → нужен pnpm build:blocks
      # выше по джобу (он там есть). Напрямую import не годится: sanitize-html
      # тянет ESM-only htmlparser2, на котором jest этого сервиса падает —
      # по той же причине НЕ запускается packages/theme-base/blocks/Page/
      # __tests__/Page.sanitize.test.ts (мёртвый гард, отдельная задача).
      - run: pnpm exec jest --runInBand src/themes/__tests__/checkout-terms-xss.spec.ts
      # Кнопка оплаты «как у Shopify» (владелец, 14.09): её видно всегда.
      # Когда схема перестала заливать левую колонку, кнопка осталась на паре
      # токенов схемы, а пары собраны под фон ТОЙ ЖЕ схемы — на фоне темы
      # плашка совпадала с колонкой. Замер витрин: 7 связок из 21 давали 1.00:1
      # (rose scheme-4, satin scheme-4, bloom scheme-1/2, vanilla scheme-1/3/4).
      # Теперь: --color-button-bg остаётся, если даёт ≥ 3:1; иначе берётся самая
      # контрастная роль ТОЙ ЖЕ схемы; если и она не тянет — затеняется до
      # порога с сохранением оттенка. Подпись ≥ 4.5:1 считается по яркости.
      # Гард считает контраст ПО-НАСТОЯЩЕМУ на матрице «5 тем × все схемы ×
      # правдоподобные фоны колонки» (144 проверки) и исполняет ровно тот текст
      # расчёта, который инлайнится в блок. Саботаж проверен: возврат прежней
      # логики красит 67 проверок, включая все 7 связок владельца.
      - run: pnpm exec jest --runInBand src/themes/__tests__/checkout-submit-contrast.spec.ts
      # Тестировщик 14.09 вернул пункт 18-А: «во вкладке Оформление заказа
      # убрать подвал, где идёт Powered by merfy» — на скриншоте внизу чекаута
      # ПОЛНЫЙ подвал витрины (колонки «Навигация»/«Информация», телефон,
      # иконки платёжных систем). Замер пяти витрин и пяти превью показал, что
      # на текущем main этого нет — но обе дыры, через которые подвал приезжал,
      # были на месте, и прошлый круг их не закрывал:
      #   1) причина в ДАННЫХ: `migrateCheckoutPage` дописывает в страницу
      #      чекаута блок `Footer` — копию подвала главной вместе с id. Замер:
      #      extractPageBlocks(ревизия,'page-checkout') → [CheckoutHeader,
      #      CheckoutForm, CheckoutSummary, Footer]. Любой рендер ПО БЛОКАМ
      #      (в проде — фолбэк превью, когда у темы нет собранного шелла
      #      checkout/index.html) рисовал подвал витрины;
      #   2) причина в ИНЪЕКЦИИ: `replaceCheckoutFooterStrip` умела только
      #      подменить УЖЕ СТОЯЩУЮ полосу. Шелл с подвалом витрины возвращался
      #      байт-в-байт («Powered by» 1, <ul> 1, полосы нет) — молча, без warn.
      #      Отсюда и «прошлая правка не сработала»: она заменяла полосу на
      #      полосу, а убрать подвал витрины не умела.
      # Гард сторожит ПРИЧИНЫ: на странице с хромом checkout блоки хрома
      # витрины не являются телом, а инъекция обязана убрать подвал витрины и
      # поставить полосу (и дописать её, если подвала нет вовсе — прежний
      # симптом flux). Плюс калибровка: подвал витрины темы действительно
      # несёт эти маркеры, иначе проверка сторожила бы пустоту.
      # Саботаж проверен: возврат блока в тело чекаута красит 4 проверки,
      # возврат «умеем только подменять» — 2.
      # Рендерит СКОМПИЛИРОВАННЫЕ блоки и секции тем → нужны pnpm build:blocks
      # и pnpm build:theme-sections выше по джобу (они там есть).
      - run: pnpm exec jest --runInBand src/themes/__tests__/checkout-no-storefront-footer.spec.ts
      - run: pnpm conformance:satin
      - run: pnpm check:css-layers
      - run: pnpm validate:page-seeds
      - name: Upload Satin conformance evidence
        if: failure() && hashFiles('conformance-results/satin/report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: satin-structural-conformance
          path: conformance-results/satin
          if-no-files-found: error
          retention-days: 14

  deploy-to-coolify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-and-test
      - satin-structural-conformance
    runs-on: ubuntu-latest
    steps:
      - name: Deploy through the Coolify API
        # Вебхуком нельзя: при выключенном автодеплое Coolify его игнорирует, а
        # по ответу это не видно. И запрос в любом случае лишь ставит сборку в
        # очередь — 200 означает «принято», а не «выкатано»: 2026-09-15 так
        # прошли две зелёные выкатки, не доехавшие до прода (DEBT-31).
        #
        # Повтор — только на сигнатуре сетевого сбоя сервера (`api.github.com`
        # в логах Coolify). Сборку, упавшую по другой причине, повторять незачем.
        run: |
          set -euo pipefail
          api="http://200.169.180.243:8000/api/v1"
          auth="Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"

          for attempt in 1 2 3; do
            response=$(curl -fsS -X POST -H "$auth" \
              "$api/deploy?uuid=q40c8ww44ss4ckogo8w0csso&force=false")
            deployment=$(echo "$response" | jq -r '.deployments[0].deployment_uuid')
            if [ -z "$deployment" ] || [ "$deployment" = "null" ]; then
              echo "Coolify не вернул номер выкатки: $response"
              exit 1
            fi
            echo "попытка $attempt: выкатка $deployment поставлена в очередь"

            status=""
            for _ in $(seq 1 60); do
              sleep 15
              status=$(curl -fsS -H "$auth" "$api/deployments/$deployment" | jq -r '.status')
              echo "статус: $status"
              case "$status" in finished|failed|cancelled) break ;; esac
            done

            if [ "$status" = "finished" ]; then
              echo "выкатка дошла до конца"
              exit 0
            fi
            if [ "$status" != "failed" ] && [ "$status" != "cancelled" ]; then
              echo "::error::за пятнадцать минут выкатка не пришла к финальному статусу"
              exit 1
            fi

            logs=$(curl -fsS -H "$auth" "$api/deployments/$deployment" | jq -r '.logs')
            if echo "$logs" | grep -q 'api.github.com'; then
              echo "::warning::сервер не достучался до api.github.com — повторяю"
              continue
            fi
            echo "::error::выкатка завершилась статусом $status"
            echo "$logs" | tail -c 3000
            exit 1
          done

          echo "::error::три попытки подряд упали на сетевом сбое сервера"
          exit 1
