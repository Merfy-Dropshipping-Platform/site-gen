# Стенд сборщика (design.md блока 6): база sites, брокер и хранилище тех же версий, что на dev — Postgres 17
# (база sites dev-контура), RabbitMQ 3.13 (факт 21), MinIO как у блока 5. Учётки — только для этого стенда. Порты —
# свои, чтобы не мешать стендам блока 5 (19000, 19100) и локальным merfy-postgres и merfy-rabbitmq (5432, 5672).
name: storefront-builder-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: builder-test
      POSTGRES_PASSWORD: builder-test-only
      POSTGRES_DB: sites_service
    ports: ["15432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "builder-test", "-d", "sites_service"]
      interval: 2s
      retries: 30
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: builder-test
      RABBITMQ_DEFAULT_PASS: builder-test-only
    ports: ["15682:5672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 3s
      retries: 40
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["minio", "server", "/data"]
    environment:
      MINIO_ROOT_USER: builder-test
      MINIO_ROOT_PASSWORD: builder-test-only
      MC_HOST_local: http://builder-test:builder-test-only@127.0.0.1:9000
    ports: ["19200:9000"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30
