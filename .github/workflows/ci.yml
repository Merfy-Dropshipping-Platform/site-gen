name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sites_service
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sites_service"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.14.0

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure GitHub Packages auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
        run: >-
          pnpm config set
          "//npm.pkg.github.com/:_authToken"
          "$NODE_AUTH_TOKEN"
          --location=user

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare environment variables
        run: |
          cat <<'EOF' > .env.local
          POSTGRES_PASSWORD=postgres123
          POSTGRES_DB=sites_service
          POSTGRES_USER=postgres
          DATABASE_URL=postgresql://postgres:postgres123@localhost:5432/sites_service
          NODE_ENV=test
          EOF

      - name: Wait for Postgres
        run: |
          for i in {1..10}; do
            if nc -z localhost 5432; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres..."
            sleep 3
          done
          echo "Postgres failed to start" >&2
          exit 1

      - name: Run database migrations
        run: pnpm run db:migrate

      - name: Run lint
        # Existing main has repository-wide Prettier/type-aware ESLint debt.
        # Keep it visible without blocking deploys until that debt is cleaned up.
        continue-on-error: true
        run: pnpm run lint:check

      - name: Lint Rose heading regression tests
        run: >-
          pnpm exec eslint
          src/generator/__tests__/rose-heading-size.spec.ts
          src/themes/__tests__/page-blocks-heading-size.spec.ts

      - name: Run build
        run: pnpm run build

      # Ниже — проверки, которые лежали в репозитории и не гонялись НИ ОДНОЙ
      # джобой (аудит 13.09). Джоба build-and-test до этого не запускала ни
      # одного теста вообще: поднимала Postgres, катала миграции, собирала — и
      # всё. Сюда положены только те группы, которым не нужны артефакты тем:
      # они считаются по исходникам, идут секунды и на origin/main зелёные.

      # Миграции ревизий переписывают данные мерчанта при КАЖДОМ чтении: цена
      # ошибки — молча испорченная страница у живого магазина. Три файла из
      # этой папки уже сторожила джоба satin, остальные одиннадцать — нет.
      # 14 файлов, 116 проверок, ~4 c.
      - name: Тесты миграций ревизий
        run: pnpm exec jest --runInBand src/utils/__tests__/

      # Контракт тем: схема манифеста, реестр токенов, резолвер страниц,
      # конформанс-движок. Джоба satin гоняла отсюда только conformance-*
      # (9 сьютов из 40). 39 сьютов, 418 проверок, ~3 c.
      #
      # cli-validate.test.ts СОЗНАТЕЛЬНО оставлен вне этого шага и остаётся
      # красным: он ловит настоящую поломку — packages/theme-bloom/theme.json
      # объявляет токен `--product-card-padding`, которого нет в TOKEN_REGISTRY,
      # и CLI падает на нём раньше, чем доходит до проверяемого сообщения.
      # Чинить надо манифест, а не тест; до тех пор вешать на джобу вечно
      # красный шаг нельзя — такую джобу перестают читать.
      - name: Тесты пакета theme-contract
        working-directory: packages/theme-contract
        # cli-validate исключён осознанно: он ловит НАСТОЯЩУЮ поломку — токен
        # --product-card-padding не зарегистрирован в TOKEN_REGISTRY, из-за чего
        # CLI падает на манифестах flux (16 расхождений), rose (22), satin и
        # bloom (по 1). Пока токен не заведён, шаг был бы вечно красным, а
        # вечно красную джобу перестают читать. Починка — в плане, P3.
        run: >-
          pnpm exec jest --config jest.config.ts --runInBand
          --testPathIgnorePatterns 'cli-validate'
          --testPathIgnorePatterns "/node_modules/" "/__tests__/fixtures/"
          "__tests__/cli-validate.test.ts"

      # Манифест vanilla — единственный из пяти, который проходит
      # ThemeManifestSchema (у flux 16 расхождений, у rose 22, у satin и bloom
      # по одному). Замок ставим на то, что уже чисто, чтобы не уехало и оно.
      - name: Тесты манифеста темы vanilla
        working-directory: packages/theme-vanilla
        run: pnpm exec jest --config jest.config.ts --runInBand

  satin-structural-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack prepare pnpm@10.14.0 --activate
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
      - run: pnpm build
      - run: pnpm build:blocks
      - run: pnpm build:theme-sections satin
      - run: pnpm exec tsx scripts/run-theme-build.ts satin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
      # Снимки HTML секций по пяти темам: ловят «починили одно — сломали три»
      # в момент правки, а не через день у тестера. Секции собираются для всех
      # тем, а не только для satin, иначе сравнивать не с чем.
      - run: pnpm build:theme-sections:all
      - run: pnpm test:section-snapshots
      # Глаз у именованного параметра: секция рендерится дважды — обычно и со
      # скрытым полем. Снимки этого не ловят: они рендерят без hiddenFields.
      - run: pnpm test:hidden-fields
      # Item-уровневый «глаз»: точечный hot-render блока обязан отбрасывать
      # скрытые элементы так же, как страница превью и сборка витрины.
      - run: pnpm test:hidden-items
      # Галерея: канон — три плитки, а ревизия с четырьмя и больше обязана
      # разбираться и рисовать три, а не умирать.
      - run: pnpm test:gallery-count
      # Состав параметров секций менять нельзя (владелец, 2026-09-13). Гард
      # сверяет фактический состав панелей пяти тем со снимком
      # conformance/panel-canon.json и падает с именем темы, блока и поля.
      - run: pnpm test:panel-canon
      # Подпанель «Слайд»: состав и типы контролов по эталону b11d0487 плюс
      # рендер-пруф «Затемнения». Состав уже терялся молча — слиянием 283acab2,
      # где конфликт по Slideshow.puckConfig разрешили в пользу старой ветки.
      - run: pnpm test:slide-panel
      # Промо-баннер: контрола «Регистр текста» в панели нет, а текст остаётся
      # таким, каким мерчант его ввёл.
      - run: pnpm test:promo-banner-panel
      # Item-уровневый «глаз» в дереве и дефолты контролов сайдбара: оба теста
      # лежали в репозитории и не гонялись ни одной джобой — значит не
      # сторожили ничего (та же болезнь, что у rich-text-bold-italic).
      - run: pnpm test:hidden-list-items
      - run: pnpm test:panel-defaults
      # Порядок медиафайлов секции «Товар»: клик по миниатюре меняет только
      # отображаемое фото героя, позиции файлов неизменны. Оба порта секции
      # (общий theme-base и собственный flux) держат один контракт.
      - run: pnpm test:media-order
      # «Увеличение» секции «Товар»: настройка доезжала до разметки
      # (data-zoom-mode), но читать её было некому — в макете по умолчанию «2
      # колонки» героя нет, а проводка висела на нём, поэтому ни «Наведение», ни
      # «Нажатие» не давали ни обработчика, ни курсора (баг тестировщика
      # 2026-09-13, п.1). Гард держит оба порта секции.
      - run: pnpm test:zoom-wiring
      # Образцы вариаций: составное имя цвета («Светло-голубой») оставалось
      # текст-кнопкой, потому что цвет искался ТОЧНЫМ совпадением со словарём —
      # из девяти образцов формой «Круг» становились восемь. Гард держит класс
      # имён (дефис, регистр, ё/е, пробелы, падежи) в обоих портах.
      - run: pnpm test:variant-colors
      # «Ж»/«К» панели: начертания обязаны доехать до витрины разметкой, а не
      # сырым тегом, и при этом не пропустить чужой HTML мерчанта. Тест лежал в
      # репозитории с 54823834, но в CI не гонялся — значит не сторожил ничего.
      - run: pnpm exec jest --runInBand src/themes/__tests__/rich-text-bold-italic.spec.ts
      # Шапка на всех страницах = шапка главной (жалоба тестировщика №13).
      # Блок Header лежит копией в каждой странице ревизии и в каждом сиде темы;
      # без этих проверок копии снова разъедутся: замер 2026-09-13 дал у vanilla
      # пять разных шапок на восьми страницах, у satin и bloom — по четыре.
      # Проверки: (1) миграция ревизии сводит шапку к главной, (2) досеянная
      # страница получает её же, (3) сиды всех пяти тем совпадают с home.json,
      # (4) «Цветовая схема меню» рендерится одинаково от числа и от строки,
      # (5) страница «Профиль» заведена штатным механизмом (жалоба №14).
      - run: pnpm exec jest --runInBand src/utils/__tests__/revision-migrations-header-unify.test.ts src/themes/__tests__/page-blocks-header-unify.spec.ts src/themes/__tests__/page-seed-header-parity.spec.ts src/utils/__tests__/revision-migrations-profile.test.ts
      - run: pnpm exec jest --runInBand src/themes/__tests__/header-menu-scheme-notation.spec.ts
      - run: pnpm test:conformance:shared
      - run: pnpm test:conformance:satin
      - run: node --test scripts/__tests__/block-source-layout.test.mjs
      - run: node --test scripts/__tests__/workspace-docker-layout.test.mjs
      # Остальные node:test-проверки из scripts/__tests__. Раннер у них
      # встроенный (node --test), конфига им не нужно — и ровно поэтому их
      # никто не подхватывал: в CI руками были вписаны только две строки выше.
      # 16 файлов, 647 проверок, ~11 c. Зелёные на origin/main.
      #
      # Вне списка сознательно оставлен flux-header-reference-contract.test.mjs:
      # он красный и ловит настоящее расхождение (Header главной flux уехал на
      # scheme-2 ревертом d6d9b1ca, а blockDefaults.PromoBanner.colorScheme
      # перебивает фирменный navy). Это правка тем, не теста.
      - name: Контракты исходников и утилит сборки (node:test)
        run: >-
          node --test
          scripts/__tests__/catalog-block-aspects.test.mjs
          scripts/__tests__/ci-theme-conformance-layout.test.mjs
          scripts/__tests__/compute-ranges.test.mjs
          scripts/__tests__/flux-home-contract.test.mjs
          scripts/__tests__/flux-section-source-contract.test.mjs
          scripts/__tests__/github-source.test.mjs
          scripts/__tests__/index-ts.test.mjs
          scripts/__tests__/migrate-block-to-tokens.test.mjs
          scripts/__tests__/registry.test.mjs
          scripts/__tests__/rewrite-base-classes.test.mjs
          scripts/__tests__/scheme-color-filter.test.mjs
          scripts/__tests__/snapshot-container.test.mjs
          scripts/__tests__/structural-dimension-filter.test.mjs
          scripts/__tests__/transform-utilities.test.mjs
          scripts/__tests__/utility-classify.test.mjs
          scripts/__tests__/validate-token-completeness.test.mjs
      - run: pnpm exec jest --runInBand src/generator/__tests__/pnpm-invocation.spec.ts
      - run: pnpm exec jest --runInBand src/themes/__tests__/block-artifact-resolver.spec.ts
      - run: pnpm exec jest --runInBand src/themes/__tests__/cart-drawer-contract.spec.ts
      # Цветовая схема сайдбара корзины (просьба владельца 13.09). Сторожит не
      # «поле появилось», а ЖИВОСТЬ: настройка обязана быть источником схемы для
      # дровера и красить его во всех пяти темах. Замер в Chromium показал, что
      # до правки дровер не перекрашивался нигде, кроме vanilla, — правила
      # портов лежат в @layer base и проигрывают утилите `bg-white` из
      # дизайн-пакета. Поэтому тест отдельно проверяет, что покраска идёт БЕЗ
      # слоя и повторяет набор частей, объявленный портами.
      - run: pnpm exec jest --runInBand src/themes/__tests__/cart-drawer-scheme.spec.ts
      # Белая полоса по всему магазину при клике на «Подвал» (тестировщик
      # 13.09). Агент превью звал `scrollIntoView`, а тот по спецификации
      # прокручивает ВСЮ цепочку предков — включая документ конструктора за
      # границей кадра. Подвал последний: внутренний документ уже внизу,
      # остаток добирался прокруткой канваса, кадр уезжал вверх и снизу
      # открывался белый фон коробки. Тест сторожит оба конца: агент пяти тем
      # не содержит `scrollIntoView`, а замена доскроллит ровно туда же и
      # упирается в низ СВОЕГО документа.
      - run: pnpm exec jest --runInBand src/services/__tests__/preview-agent-frame-scroll.spec.ts
      # Подпись опции «Дополнительная» в «Мультирядах» (просьба владельца 13.09)
      # — по всем пяти темам, плюс запрет на возврат слова «Вторичная» в любую
      # панель любой темы. Канон-гард ловит состав, но не бережёт от того, что
      # старую подпись вернут соседней секцией.
      - run: pnpm exec jest --runInBand src/themes/__tests__/multirows-button-label.spec.ts
      - run: pnpm exec jest --runInBand src/themes/__tests__/preview-cart-contract.spec.ts
      # Чекаут и корзина, баг-репорт 12/16/17. Сторожат три расстыковки, каждая
      # из которых жила при зелёном CI:
      #   - превью конструктора отдавало чекаут без мерчантской шапки и без схем
      #     секций (их применяла ТОЛЬКО live-сборка);
      #   - `migrateCartPage` стирала «Промежуточный итог», который сеют темы;
      #   - сводка чекаута стояла в верху колонки и уезжала с первым скроллом.
      # Плюс баг-репорт 18, три пункта тестировщика по чекауту:
      #   18-А — подвал чекаута был маркетинговой полосой «Powered by Merfy»
      #     (у flux подвала не было вовсе), а должен быть правовым: ссылки на
      #     политики магазина из того же реестра, что и обычный подвал;
      #   18-Б — липкую сводку резал `max-height` + свой скролл: на 30 позициях
      #     прокрутка страницы доставала только до 9-10 из них;
      #   18-В — правка «Цветовой схемы» секций чекаута не доезжала до превью:
      #     у мега-блоков не было `data-puck-component-id`, и `update-block`
      #     конструктора не находил секцию («keep old DOM»).
      # Гард подвала рендерит СКОМПИЛИРОВАННЫЙ блок → нужен pnpm build:blocks
      # выше по джобу (он там есть).
      - run: >-
          pnpm exec jest --runInBand
          src/themes/__tests__/checkout-chrome-parity.spec.ts
          src/themes/__tests__/checkout-summary-sticky.spec.ts
          src/themes/__tests__/checkout-footer-legal.spec.ts
          src/themes/__tests__/checkout-block-identity.spec.ts
          src/utils/__tests__/revision-migrations-cart.test.ts
      # Третий круг тестировщика (те же пункты в третий раз). Каждый гард стоит
      # на том слое, где замер прода показал разрыв, а не там, где удобно:
      #   п.1 — тоггл «Контейнер» у «Сворачиваемого раздела» писал ЛЕГАСИ-ключ
      #     `container.enabled`, а порт читал канон `containerEnabled` (дефолт
      #     "false") → контейнер в рендере выключен всегда, класс схемы не
      #     печатался НИКОГДА. Фикстуры теста — дословный payload с прода;
      #   п.2 — параметры шапки прошлый круг выровнял, а НАБОР СЕКЦИЙ группы
      #     «Шапка» — нет: промо-баннер лежал на части страниц (rose 5 из 11,
      #     flux/bloom только на главной). Гард стоит и на миграции, и на сидах;
      #   п.4 — «очень плохо работают цветовые схемы» на чекауте: схема красила
      #     прозрачную секцию (или пятно под формой), а не КОЛОНКУ; у
      #     vanilla/satin/flux поверхности не было вовсе — колонка обрывалась на
      #     1079px из 1280. Плюс класс схемы пропадал на числовом значении.
      - run: >-
          pnpm exec jest --runInBand
          src/themes/__tests__/checkout-and-container-round3.spec.ts
          src/themes/__tests__/checkout-scheme-surface.spec.ts
          src/themes/__tests__/header-group-seeds.spec.ts
          src/utils/__tests__/header-group-round3.test.ts
          src/services/__tests__/preview-checkout-column-scheme.spec.ts
      # Шапки НАД колонками чекаута быть не должно (эталон владельца,
      # Shopify-подобный чекаут): логотип стоит ВНУТРИ левой колонки, поэтому
      # правая идёт поверхностью от самого верха окна. Замер «до» (собранные
      # витрины, Chromium, 1440×900, 13.09): полоса шапки 0..134.39 у rose и
      # 0..132 у vanilla/flux/satin/bloom — над ОБЕИМИ колонками, и над цветной
      # колонкой сводки висела белая полоса (владелец обвёл её на скриншоте).
      # Браузера в CI нет, поэтому гард стоит на том, ЧЕМ геометрия задана:
      # шапка обязана лежать внутри колонки формы первым узлом, перед колонкой
      # внутри сплита не должно быть ничего, а подмена мерчантской шапки
      # (chrome-assembler) обязана попадать туда же. Саботаж-проверки повторяют
      # прежнюю раскладку и требуют, чтобы предикат её отверг.
      - run: pnpm exec jest --runInBand src/themes/__tests__/checkout-header-in-column.spec.ts
      - run: pnpm conformance:satin
      - run: pnpm check:css-layers
      - run: pnpm validate:page-seeds
      - name: Upload Satin conformance evidence
        if: failure() && hashFiles('conformance-results/satin/report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: satin-structural-conformance
          path: conformance-results/satin
          if-no-files-found: error
          retention-days: 14

  deploy-to-coolify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-and-test
      - satin-structural-conformance
    runs-on: ubuntu-latest
    steps:
      - name: Call Coolify deploy webhook
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: >-
          curl
          --fail-with-body
          --silent
          --show-error
          --request GET
          "$COOLIFY_DEPLOY_WEBHOOK"
          --header "Authorization: Bearer $COOLIFY_TOKEN"
