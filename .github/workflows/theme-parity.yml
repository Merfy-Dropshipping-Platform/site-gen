name: theme-parity

# Пути включают themes/** — живые порты тем лежат именно там, а не только в
# packages/theme-**; без этого визуальный диф ни разу не запускался на правках
# секций. И триггер на push в main: работа идёт прямо в main, PR почти не
# создаётся, а проверка, которая не запускается, ничего не проверяет.
# Список путей продублирован: YAML-якоря в workflow GitHub Actions не работают.
on:
  push:
    branches: ["main"]
    paths:
      - 'themes/**'
      - 'packages/theme-**'
      - 'src/controllers/preview*'
      - 'src/services/preview*'
      - 'src/themes/**'
      - '.github/workflows/theme-parity.yml'
      - 'scripts/visual-diff-themes.mjs'
      - 'visual-diff-thresholds.json'
  pull_request:
    paths:
      - 'themes/**'
      - 'packages/theme-**'
      - 'src/controllers/preview*'
      - 'src/services/preview*'
      - 'src/themes/**'
      - '.github/workflows/theme-parity.yml'
      - 'scripts/visual-diff-themes.mjs'
      - 'visual-diff-thresholds.json'

permissions:
  contents: read
  packages: read

jobs:
  visual-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Configure GitHub Packages auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
        run: >-
          pnpm config set
          "//npm.pkg.github.com/:_authToken"
          "$NODE_AUTH_TOKEN"
          --location=user

      - name: Install deps
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps

      # Боковое меню глазами человека (документ «баги бокового меню», 22.09):
      # на телефоне панель во весь экран, шапка одна, панель от верха экрана и
      # после ресайза, в шапке панели только корзина, панель листается, а
      # страница под ней нет, стрелка раскрывает вложенные и не закрывает меню.
      # Всё это про то, что лежит сверху и куда уходит нажатие, — нужен браузер;
      # статический сканер шапки (header-menu-scan в ci.yml) этого не видит.
      # Chromium уже стоит шагом выше, поэтому замер живёт здесь, а не в ci.yml.
      - name: Сборка секций для замера бокового меню
        run: pnpm build && pnpm build:blocks && pnpm build:theme-sections:all

      - name: Боковое меню — правила от лица человека (5 тем × 8 сценариев)
        run: pnpm qa:side-menu

      - name: Checkout monorepo figma-references (separate repo)
        # The super-repo commits the figma-references folder. In CI we run
        # from inside the sites repo only, so the references aren't present
        # by default. Clone shallow into the expected relative path.
        env:
          MONOREPO_REF: ${{ secrets.MONOREPO_REF_TOKEN }}
        run: |
          if [ -n "$MONOREPO_REF" ]; then
            mkdir -p ../../../specs/079-themes-figma-parity
            git clone --depth 1 \
              "https://x-access-token:$MONOREPO_REF@github.com/Merfy-Dropshipping-Platform/merfy-super-repo.git" \
              /tmp/monorepo
            cp -r /tmp/monorepo/specs/079-themes-figma-parity/figma-references \
                  ../../../specs/079-themes-figma-parity/figma-references
          else
            echo "::warning::MONOREPO_REF_TOKEN not set — all references will be missing, diff will pass by default"
          fi

      - name: Run visual-diff
        env:
          PREVIEW_BASE: https://gateway.merfy.ru
        run: pnpm visual-diff:themes

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-report
          path: visual-diff-report
          retention-days: 7
