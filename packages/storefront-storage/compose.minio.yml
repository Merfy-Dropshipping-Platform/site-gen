# MinIO для тестов и пробы пакета (design.md блока 5): та же версия, что на dev и в проде (факт 11). Учётка — только
# для этого стенда, порт 19100 — чтобы не мешать стенду раздачи из nginx-minio-proxy (19000).
name: storefront-storage-test

services:
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["minio", "server", "/data"]
    environment:
      MINIO_ROOT_USER: storefront-test
      MINIO_ROOT_PASSWORD: storefront-test-only
      MC_HOST_local: http://storefront-test:storefront-test-only@127.0.0.1:9000
    ports: ["19100:9000"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30
